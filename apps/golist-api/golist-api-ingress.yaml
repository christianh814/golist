apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: golist-api-ingress
  annotations:
    ingress.cilium.io/host-listener-port: "80"
spec:
  ingressClassName: cilium
  rules:
  - host: golist-api.7f000001.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: golist-api
            port:
              number: 8080
