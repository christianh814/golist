apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: golist-frontend-ingress
spec:
  ingressClassName: cilium
  rules:
  - host: golist.7f000001.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: golist-frontend
            port:
              number: 8080
